<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TAG Lei Tracker by H-PEP: Spark Aloha!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌺%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 1000;
    }

    header h1 {
      margin: 0 12px 0 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    label {
      font-size: 14px;
    }

    select,
    button {
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
    }

    button {
      cursor: pointer;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 70vh;
    }

    .popup small {
      color: #555;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
      }

      header h1 {
        width: 100%;
        font-size: 16px;
        margin-right: 0;
      }

      .controls {
        width: 100%;
      }

      select {
        flex: 1;
        min-width: 120px;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>TAG Lei Tracker by H-PEP: Spark Aloha!</h1>

    <div class="controls">
      <label for="leiFilter"><strong>Filter by Lei ID:</strong></label>
      <select id="leiFilter">
        <option value="__ALL__">All Lei</option>
      </select>
      <button id="refreshBtn" type="button" title="Reload map data">Refresh</button>
    </div>
  </header>

  <div id="map"></div>
</div>

<script>
(function () {
  "use strict";

  var SHEET_API_URL = "https://script.google.com/macros/s/AKfycby51HsMDb37R0vZZmW9Eirx80I6blvegVPdyBs7CqVPOE1iQVsRKPe3KpM0tfSuRKS5lA/exec";

  var FIELD_MAP = {
    timestamp: "Timestamp",
    leiId: "Lei ID",
    city: "City / Town and Country",
    lat: "Latitude",
    lon: "Longitude"
  };

  var map = L.map("map", {
    worldCopyJump: true,
    minZoom: 2
  }).setView([20.8, -156.3], 3);

  // Esri World Street Map: English-oriented global place labels.
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri",
      maxZoom: 19
    }
  ).addTo(map);

  setTimeout(function () {
    map.invalidateSize();
  }, 0);

  window.addEventListener("resize", function () {
    map.invalidateSize();
  });

  var clusterGroup = L.markerClusterGroup();
  map.addLayer(clusterGroup);

  var leiLayers = new Map();
  var cityCache = new Map();
  var lastGeocodeRequestAt = 0;

  function extractLeiNumber(value) {
    var match = String(value).match(/\d+(?:\.\d+)?/);
    return match ? parseFloat(match[0]) : null;
  }

  function compareLeiIds(a, b) {
    var aNumber = extractLeiNumber(a);
    var bNumber = extractLeiNumber(b);

    if (aNumber !== null && bNumber !== null && aNumber !== bNumber) {
      return aNumber - bNumber;
    }

    return String(a).localeCompare(String(b), undefined, {
      numeric: true,
      sensitivity: "base"
    });
  }

  // Stable color based on the Lei ID itself, so colors do not change when new lei are added.
  function colorForLei(leiId) {
    var number = extractLeiNumber(leiId);

    if (number === null) {
      var hash = 0;
      var text = String(leiId);
      for (var i = 0; i < text.length; i++) {
        hash = text.charCodeAt(i) + ((hash << 5) - hash);
      }
      number = Math.abs(hash);
    }

    var hue = (number * 137.508) % 360;
    return "hsl(" + hue + ", 75%, 43%)";
  }

  function cacheKeyForCity(city) {
    return String(city).trim().toLowerCase();
  }

  function sleep(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  async function geocodeCity(city) {
    if (!city) return null;

    var key = cacheKeyForCity(city);

    if (cityCache.has(key)) {
      return cityCache.get(key);
    }

    var storageKey = "tagLeiGeo_" + key;

    try {
      var saved = localStorage.getItem(storageKey);
      if (saved) {
        var parsed = JSON.parse(saved);
        cityCache.set(key, parsed);
        return parsed;
      }
    } catch (e) {
      // Continue without localStorage if the browser blocks it.
    }

    // Public Nominatim usage should stay at or below roughly one request per second.
    var elapsed = Date.now() - lastGeocodeRequestAt;
    if (elapsed < 1100) {
      await sleep(1100 - elapsed);
    }

    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=en&q=" + encodeURIComponent(city);

    try {
      lastGeocodeRequestAt = Date.now();
      var response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) return null;

      var results = await response.json();
      if (!Array.isArray(results) || results.length === 0) return null;

      var location = {
        lat: parseFloat(results[0].lat),
        lon: parseFloat(results[0].lon)
      };

      if (!isFinite(location.lat) || !isFinite(location.lon)) return null;

      cityCache.set(key, location);

      try {
        localStorage.setItem(storageKey, JSON.stringify(location));
      } catch (e) {
        // Cache is optional.
      }

      return location;
    } catch (e) {
      console.warn("Could not geocode city:", city, e);
      return null;
    }
  }

  async function fetchRows() {
    var response = await fetch(SHEET_API_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Data request failed: " + response.status);
    }

    var json = await response.json();
    var rows = Array.isArray(json && json.data) ? json.data : json;

    if (!Array.isArray(rows)) {
      throw new Error("The Apps Script endpoint did not return an array of rows.");
    }

    var normalized = rows.map(function (row, rowIndex) {
      var latitude = parseFloat(row[FIELD_MAP.lat]);
      var longitude = parseFloat(row[FIELD_MAP.lon]);
      var timestamp = new Date(row[FIELD_MAP.timestamp]);
      var timestampMs = timestamp.getTime();

      return {
        timestamp: timestamp,
        timestampMs: isNaN(timestampMs) ? null : timestampMs,
        sourceOrder: rowIndex,
        leiId: String(row[FIELD_MAP.leiId] || "").trim(),
        city: String(row[FIELD_MAP.city] || "").trim(),
        lat: isFinite(latitude) ? latitude : null,
        lon: isFinite(longitude) ? longitude : null
      };
    }).filter(function (row) {
      return row.leiId !== "";
    });

    // If GPS is missing, place the point at the center of the required city.
    for (var i = 0; i < normalized.length; i++) {
      var item = normalized[i];

      if ((item.lat === null || item.lon === null) && item.city) {
        var geocoded = await geocodeCity(item.city);
        if (geocoded) {
          item.lat = geocoded.lat;
          item.lon = geocoded.lon;
        }
      }
    }

    return normalized.filter(function (row) {
      return row.lat !== null && row.lon !== null;
    });
  }

  function clearMapData() {
    clusterGroup.clearLayers();

    leiLayers.forEach(function (layerSet) {
      if (layerSet.line && map.hasLayer(layerSet.line)) {
        map.removeLayer(layerSet.line);
      }
    });

    leiLayers.clear();
  }

  function selectLei(leiId) {
    var select = document.getElementById("leiFilter");
    select.value = leiId;
    applyFilter(true);
  }

  function render(data) {
    clearMapData();

    var byLei = new Map();

    data.forEach(function (item) {
      if (!byLei.has(item.leiId)) {
        byLei.set(item.leiId, []);
      }
      byLei.get(item.leiId).push(item);
    });

    var ids = Array.from(byLei.keys()).sort(compareLeiIds);
    var select = document.getElementById("leiFilter");
    var previousSelection = select.value;

    var optionsHtml = '<option value="__ALL__">All Lei</option>';
    ids.forEach(function (id) {
      optionsHtml += '<option value="' + escapeHtml(id) + '">' + escapeHtml(id) + '</option>';
    });
    select.innerHTML = optionsHtml;

    if (ids.indexOf(previousSelection) !== -1) {
      select.value = previousSelection;
    } else {
      select.value = "__ALL__";
    }

    var allPoints = [];

    ids.forEach(function (leiId) {
      var rows = byLei.get(leiId);

      // Route order is determined by the Form Timestamp for this lei.
      // Original response order is only used as a tie-breaker when two timestamps match.
      rows.sort(function (a, b) {
        if (a.timestampMs === null && b.timestampMs === null) {
          return a.sourceOrder - b.sourceOrder;
        }
        if (a.timestampMs === null) return 1;
        if (b.timestampMs === null) return -1;
        if (a.timestampMs !== b.timestampMs) return a.timestampMs - b.timestampMs;
        return a.sourceOrder - b.sourceOrder;
      });

      var color = colorForLei(leiId);
      var markerGroup = L.layerGroup();
      var path = [];

      rows.forEach(function (item) {
        var latLng = [item.lat, item.lon];
        path.push(latLng);
        allPoints.push(latLng);

        var prettyTime = isNaN(item.timestamp) ? "" : item.timestamp.toLocaleString();
        var popupHtml = '<div class="popup">' +
          '<div><strong>Lei ' + escapeHtml(item.leiId) + '</strong>' +
          (item.city ? ' — ' + escapeHtml(item.city) : '') + '</div>' +
          '<small>' + escapeHtml(prettyTime) + '</small>' +
          '</div>';

        var marker = L.circleMarker(latLng, {
          radius: 6,
          color: color,
          weight: 2,
          fillColor: color,
          fillOpacity: 0.5
        }).bindPopup(popupHtml);

        marker.on("click", function () {
          selectLei(leiId);
        });

        markerGroup.addLayer(marker);
      });

      var line = L.polyline(path, {
        color: color,
        weight: 3,
        opacity: 0.9
      });

      line.on("click", function () {
        selectLei(leiId);
      });

      clusterGroup.addLayer(markerGroup);
      line.addTo(map);

      leiLayers.set(leiId, {
        markers: markerGroup,
        line: line,
        color: color,
        points: path
      });
    });

    applyFilter(false);

    if (select.value === "__ALL__" && allPoints.length > 0) {
      map.fitBounds(L.latLngBounds(allPoints).pad(0.12));
    }
  }

  function applyFilter(zoomToSelection) {
    var selected = document.getElementById("leiFilter").value;
    var selectedPoints = [];

    leiLayers.forEach(function (layerSet, leiId) {
      var show = selected === "__ALL__" || selected === leiId;

      if (show) {
        if (!clusterGroup.hasLayer(layerSet.markers)) {
          clusterGroup.addLayer(layerSet.markers);
        }

        if (!map.hasLayer(layerSet.line)) {
          layerSet.line.addTo(map);
        }

        if (selected === leiId) {
          selectedPoints = layerSet.points.slice();
        }
      } else {
        if (clusterGroup.hasLayer(layerSet.markers)) {
          clusterGroup.removeLayer(layerSet.markers);
        }

        if (map.hasLayer(layerSet.line)) {
          map.removeLayer(layerSet.line);
        }
      }
    });

    if (zoomToSelection && selected !== "__ALL__" && selectedPoints.length > 0) {
      if (selectedPoints.length === 1) {
        map.setView(selectedPoints[0], 8);
      } else {
        map.fitBounds(L.latLngBounds(selectedPoints).pad(0.2));
      }
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character];
    });
  }

  async function init() {
    try {
      var data = await fetchRows();
      render(data);
    } catch (error) {
      console.error(error);
      alert("Failed to load the TAG Lei map data. Check the browser console for details.");
    }
  }

  document.getElementById("leiFilter").addEventListener("change", function () {
    applyFilter(true);
  });

  document.getElementById("refreshBtn").addEventListener("click", function () {
    init();
  });

  init();

  // Refresh the data every two minutes.
  setInterval(function () {
    init();
  }, 2 * 60 * 1000);
})();
</script>
</body>
</html>
